name: CI

# Quality gate (DX-1): runs on every PR and on pushes to main.
# Build → vet → lint → race tests + coverage. Make these checks required in
# branch protection so regressions cannot merge silently.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint runs on Go 1.25 to match the go.mod language version. golangci-lint v2.5.0
  # is itself built with Go 1.25 and cannot analyse packages compiled by the 1.26
  # toolchain (it panics), so lint is deliberately kept on 1.25 — separate from the
  # build/test job, which runs on 1.26.4 to ship a CVE-patched stdlib.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  # The tree is not gofmt-clean yet (backlog); a pull request must not add to it.
  # Only the Go files the PR adds or changes are checked.
  gofmt:
    name: gofmt (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: false

      - name: gofmt -l on changed Go files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- '*.go')
          if [ -z "$files" ]; then echo "no Go file changed"; exit 0; fi
          unformatted=$(echo "$files" | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build/test on Go 1.26.4: this is the toolchain that compiles the stdlib into
      # the binary, clearing the 11 stdlib CVEs addressed by backendkit v1.8.0.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
