name: CI

# Quality gate (DX-1): runs on every PR and on pushes to main.
# Build → vet → lint → race tests + coverage → govulncheck. Make these checks
# required in branch protection so regressions cannot merge silently.
#
# Every job uses the toolchain pinned in go.mod (`toolchain go1.27.1`), the
# same as backendkit: the build job fails if the two drift.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          # Build golangci-lint with the job's Go toolchain: the prebuilt
          # binaries are compiled with an older Go and refuse a module whose
          # toolchain targets a newer one.
          install-mode: goinstall
          # Skip the action's config verification, which fetches a schema at
          # runtime; local `golangci-lint run` still validates the config.
          verify: false

  # The tree is not gofmt-clean yet (backlog); a pull request must not add to it.
  # Only the Go files the PR adds or changes are checked.
  gofmt:
    name: gofmt (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: gofmt -l on changed Go files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- '*.go')
          if [ -z "$files" ]; then echo "no Go file changed"; exit 0; fi
          unformatted=$(echo "$files" | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      # go.mod's toolchain line and this workflow's Go version must agree:
      # fail loudly if they drift rather than test on one Go and ship another.
      - name: Toolchain matches go.mod
        run: |
          want=$(awk '/^toolchain /{print $2}' go.mod)
          got=$(go env GOVERSION)
          echo "go.mod toolchain: $want · CI: $got"
          test -n "$want" && test "$got" = "$want"

      - name: go.sum is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Fails on a vulnerability reachable from this module's code.
      - name: Run govulncheck
        run: govulncheck ./...
